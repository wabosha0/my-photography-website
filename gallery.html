<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - My Photography</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <p class="site-title">My Photography</p>
        <nav aria-label="Main">
            <ul>
                <li><a href="index.html" class="nav-button">Home</a></li>
                <li><a href="gallery.html" class="nav-button" aria-current="page">Gallery</a></li>
                <li><a href="about.html" class="nav-button">About</a></li>
                <li><a href="contact.html" class="nav-button">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-section">
            <h2>Gallery</h2>
            <!--
                TODO: these images are placeholders linked from other websites.
                Replace them with your own photos saved in an images/ folder,
                e.g. <img src="images/photo1.jpg" ...>
            -->
            <div class="gallery-container">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_kP4sLW3rl6UGBLmApDxsGD7-uA8dzMY_Cg&s" alt="Nature photo 1" class="gallery-image" loading="lazy">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcTktitgWQQL6cjcai1rTfuMed-rP6m87Anw&s" alt="Nature photo 2" class="gallery-image" loading="lazy">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXbACB9bxtRuo7rV0QILnvd41-02cJ9jUipQ&s" alt="Nature photo 3" class="gallery-image" loading="lazy">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1lrlIa6JaLso9XH5UVk41jq3SvzYEntEn4w&s" alt="Nature photo 4" class="gallery-image" loading="lazy">
                <img src="https://cdn.theatlantic.com/media/img/photo/2021/11/winners-2021-natural-landscape-phot/a02_proy_539__5138/main_1500.jpg" alt="Nature photo 5" class="gallery-image" loading="lazy">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSICRloqnfSQPvIDnmBIZ-_LBFfEdf4gosU-g&s" alt="Nature photo 6" class="gallery-image" loading="lazy">
            </div>
        </section>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photo" hidden>
        <button class="close" aria-label="Close photo">&times;</button>
        <img class="lightbox-content" id="lightbox-img" alt="">
    </div>

    <footer>
        <p>&copy; <span id="year"></span> My Photography. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
